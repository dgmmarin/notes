apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  annotations:
    # Validate new hosts against letsencrypt-staging first (rate limits!),
    # then switch to letsencrypt-prod.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Login prompt. The `basic-auth` Secret comes from basic-auth.sealed.yaml
    # (mise run seal-auth). Without it, nginx refuses every request.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth
    nginx.ingress.kubernetes.io/auth-realm: Notes
spec:
  ingressClassName: nginx
  rules:
    - host: notes.k8s.bitulzero.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
  tls:
    - hosts:
        - notes.k8s.bitulzero.ro
      secretName: frontend-tls
