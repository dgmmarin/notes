server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the React SPA; fall back to index.html for client-side routing.
    location / {
        try_files $uri /index.html;
    }

    # Forward API calls to the `api` Service in the same namespace.
    # "api" resolves via in-cluster DNS to the ClusterIP Service.
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
    }
}
